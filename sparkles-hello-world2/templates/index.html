<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>URL Monitor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.0/dist/css/tabler.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- =========================================================
         LOGIN
         ========================================================= -->

    <div
        id="login-page"
        class="page page-center"
    >
        <div class="container container-tight py-4">
            <div class="card card-md">
                <div class="card-body">

                    <h2 class="h2 text-center mb-4">
                        URL Monitor
                    </h2>

                    <p class="text-secondary text-center mb-4">
                        Accesso amministrativo
                    </p>

                    <form id="login-form">

                        <div class="mb-3">
                            <label class="form-label">
                                API Key
                            </label>

                            <input
                                id="api-key"
                                type="password"
                                class="form-control"
                                placeholder="API Key"
                                autocomplete="off"
                                required
                            >
                        </div>

                        <div
                            id="login-error"
                            class="alert alert-danger d-none"
                        ></div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Accedi
                        </button>

                    </form>

                </div>
            </div>
        </div>
    </div>


    <!-- =========================================================
         ADMIN
         ========================================================= -->

    <div
        id="admin-page"
        class="page d-none"
    >

        <!-- HEADER -->

        <header class="navbar navbar-expand-md d-print-none">
            <div class="container-xl">

                <div class="navbar-brand">
                    URL Monitor
                </div>

                <div class="navbar-nav flex-row order-md-last">
                    <div class="nav-item">

                        <div class="nav-link d-flex lh-1 p-0 px-2">

                            <div>
                                <div id="logged-user">
                                    Admin
                                </div>

                                <a
                                    id="logout-button"
                                    href="#"
                                    class="mt-1 small text-danger text-decoration-none"
                                >
                                    Logout
                                </a>
                            </div>

                        </div>

                    </div>
                </div>

            </div>
        </header>


        <!-- CONTENUTO -->

        <div class="page-wrapper">
            <div class="container-xl">
                <div class="page-body">

                    <!-- MESSAGGI -->

                    <div
                        id="message"
                        class="alert d-none"
                    ></div>


                    <!-- =================================================
                         GESTIONE UTENTI
                         ================================================= -->

                    <div class="card mb-3">

                        <div class="card-header">

                            <h3 class="card-title">
                                Gestione utenti
                            </h3>

                            <div class="card-actions">
                                <button
                                    type="button"
                                    class="btn btn-primary"
                                    data-bs-toggle="modal"
                                    data-bs-target="#add-user-modal"
                                >
                                    Crea utente
                                </button>
                            </div>

                        </div>

                        <div class="table-responsive">

                            <table class="table table-vcenter card-table">

                                <thead>
                                    <tr>
                                        <th>Utente</th>
                                        <th>API Key</th>
                                        <th>Admin</th>
                                        <th>Disponibile</th>
                                        <th>Azioni</th>
                                    </tr>
                                </thead>

                                <tbody id="user-table-body"></tbody>

                            </table>

                        </div>

                    </div>


                    <!-- =================================================
                         URL MONITORATI
                         ================================================= -->

                    <div class="card">

                        <div class="card-header">

                            <h3 class="card-title">
                                URL monitorati
                            </h3>

                            <div class="card-actions">

                                <div class="btn-list">

                                    <button
                                        id="add-url-button"
                                        type="button"
                                        class="btn btn-primary"
                                        data-bs-toggle="modal"
                                        data-bs-target="#add-url-modal"
                                    >
                                        Aggiungi URL
                                    </button>

                                    <button
                                        id="check-all-button"
                                        type="button"
                                        class="btn btn-primary"
                                    >
                                        Controlla tutti
                                    </button>

                                </div>

                            </div>

                        </div>

                        <div class="table-responsive">

                            <table class="table table-vcenter card-table">

                                <thead>
                                    <tr>
                                        <th>URL</th>
                                        <th>Stato</th>
                                        <th>Last check</th>
                                        <th>Azioni</th>
                                    </tr>
                                </thead>

                                <tbody id="url-table-body"></tbody>

                            </table>

                        </div>

                    </div>

                </div>
            </div>
        </div>

    </div>


    <!-- =========================================================
         MODAL — AGGIUNTA URL
         ========================================================= -->

    <div
        id="add-url-modal"
        class="modal modal-blur fade"
        tabindex="-1"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Aggiungi URL
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Chiudi"
                    ></button>

                </div>

                <form id="add-url-form">

                    <div class="modal-body">

                        <div class="mb-3">

                            <label class="form-label">
                                URL
                            </label>

                            <input
                                id="new-url"
                                type="url"
                                class="form-control"
                                placeholder="https://example.com/"
                                required
                            >

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-link link-secondary"
                            data-bs-dismiss="modal"
                        >
                            Annulla
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Aggiungi URL
                        </button>

                    </div>

                </form>

            </div>

        </div>
    </div>


    <!-- =========================================================
         MODAL — AGGIUNTA UTENTE
         ========================================================= -->

    <div
        id="add-user-modal"
        class="modal modal-blur fade"
        tabindex="-1"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Crea utente
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Chiudi"
                    ></button>

                </div>

                <form id="add-user-form">

                    <div class="modal-body">

                        <div class="mb-3">

                            <label class="form-label">
                                Nome utente
                            </label>

                            <input
                                id="new-username"
                                type="text"
                                class="form-control"
                                placeholder="Nome utente"
                                maxlength="50"
                                autocomplete="off"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-check">

                                <input
                                    id="new-user-admin"
                                    type="checkbox"
                                    class="form-check-input"
                                >

                                <span class="form-check-label">
                                    Amministratore
                                </span>

                            </label>

                        </div>

                        <div class="mb-3">

                            <label class="form-check">

                                <input
                                    id="new-user-available"
                                    type="checkbox"
                                    class="form-check-input"
                                    checked
                                >

                                <span class="form-check-label">
                                    Disponibile
                                </span>

                            </label>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-link link-secondary"
                            data-bs-dismiss="modal"
                        >
                            Annulla
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Crea utente
                        </button>

                    </div>

                </form>

            </div>

        </div>
    </div>


    <!-- =========================================================
         TABLER
         ========================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.0/dist/js/tabler.min.js"></script>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>

        let checkingAll = false;


        /* =========================================================
           API
           ========================================================= */

        async function api(url, options = {}) {

            const response = await fetch(url, {
                ...options,

                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            });

            let data;

            try {
                data = await response.json();
            } catch {
                throw new Error(
                    "Risposta non valida dal server"
                );
            }

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Errore HTTP " + response.status
                );
            }

            return data;
        }


        /* =========================================================
           MODAL
           ========================================================= */

        function closeModal(modalId) {

            const modal = document.getElementById(modalId);

            if (!modal) {
                return;
            }

            modal.classList.remove("show");
            modal.style.display = "none";

            modal.setAttribute(
                "aria-hidden",
                "true"
            );

            document
                .querySelectorAll(".modal-backdrop")
                .forEach(function (backdrop) {
                    backdrop.remove();
                });

            document.body.classList.remove("modal-open");

            document.body.style.removeProperty("overflow");
            document.body.style.removeProperty("padding-right");
        }


        /* =========================================================
           LOGIN
           ========================================================= */

        document
            .getElementById("login-form")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    const apiKey =
                        document.getElementById("api-key").value;

                    const errorElement =
                        document.getElementById("login-error");

                    errorElement.classList.add("d-none");

                    try {

                        const result = await api(
                            "/api/login",
                            {
                                method: "POST",

                                body: JSON.stringify({
                                    api_key: apiKey
                                })
                            }
                        );

                        const loggedUser =
                            document.getElementById("logged-user");

                        loggedUser.textContent =
                            result.username;

                        loggedUser.dataset.username =
                            result.username;

                        document
                            .getElementById("login-page")
                            .classList.add("d-none");

                        document
                            .getElementById("admin-page")
                            .classList.remove("d-none");

                        await loadUrls();
                        await loadUsers();

                    } catch (error) {

                        errorElement.textContent =
                            error.message;

                        errorElement.classList.remove("d-none");
                    }
                }
            );


        /* =========================================================
           URL
           ========================================================= */

        async function loadUrls() {

            const result = await api("/api/urls");

            const tbody =
                document.getElementById("url-table-body");

            tbody.innerHTML = "";

            for (const item of result.urls) {
                renderUrlRow(item);
            }
        }


        function renderUrlRow(item) {

            const tbody =
                document.getElementById("url-table-body");

            const row =
                document.createElement("tr");

            row.id =
                "row-" + encodeRowId(item.url);


            /* URL */

            const urlCell =
                document.createElement("td");

            const link =
                document.createElement("a");

            link.href = item.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = item.url;

            urlCell.appendChild(link);


            /* STATO */

            const statusCell =
                document.createElement("td");

            const badge =
                document.createElement("span");

            updateStatusBadge(
                badge,
                item.stato
            );

            statusCell.appendChild(badge);


            /* LAST CHECK */

            const lastCheckCell =
                document.createElement("td");

            lastCheckCell.textContent =
                item.last_check || "-";


            /* AZIONI */

            const actionsCell =
                document.createElement("td");

            const actions =
                document.createElement("div");

            actions.className =
                "btn-list flex-nowrap";


            const checkButton =
                document.createElement("button");

            checkButton.className =
                "btn btn-outline-primary btn-sm";

            checkButton.textContent =
                "Controlla";

            checkButton.addEventListener(
                "click",
                function () {
                    checkUrl(
                        item.url,
                        checkButton
                    );
                }
            );


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "btn btn-outline-danger btn-sm";

            deleteButton.textContent =
                "Elimina";

            deleteButton.addEventListener(
                "click",
                function () {
                    deleteUrl(item.url);
                }
            );


            actions.appendChild(checkButton);
            actions.appendChild(deleteButton);

            actionsCell.appendChild(actions);


            /* ROW */

            row.appendChild(urlCell);
            row.appendChild(statusCell);
            row.appendChild(lastCheckCell);
            row.appendChild(actionsCell);

            tbody.appendChild(row);
        }


        function updateStatusBadge(badge, status) {

            badge.className = "badge";

            if (status === 1) {

                badge.classList.add(
                    "bg-green",
                    "text-green-fg"
                );

                badge.textContent = "ONLINE";

            } else {

                badge.classList.add(
                    "bg-red",
                    "text-red-fg"
                );

                badge.textContent = "OFFLINE";
            }
        }


        function encodeRowId(url) {

            return btoa(
                encodeURIComponent(url)
            )
                .replaceAll("=", "")
                .replaceAll("+", "-")
                .replaceAll("/", "_");
        }


        async function deleteUrl(url) {

            if (
                !confirm(
                    "Vuoi eliminare questo URL?\n\n" +
                    url
                )
            ) {
                return;
            }

            try {

                await api(
                    "/api/urls/" +
                    encodeURIComponent(url),
                    {
                        method: "DELETE"
                    }
                );

                await loadUrls();

            } catch (error) {

                showMessage(
                    error.message,
                    "danger"
                );
            }
        }


        async function checkUrl(url, button = null) {

            if (button) {

                button.disabled = true;
                button.textContent = "Controllo...";
            }

            try {

                const result = await api(
                    "/api/urls/check/" +
                    encodeURIComponent(url),
                    {
                        method: "POST"
                    }
                );

                await loadUrls();

                if (
                    result.url !==
                    result.original_url
                ) {

                    showMessage(
                        "URL aggiornato a " +
                        result.url,
                        "info"
                    );
                }

            } catch (error) {

                showMessage(
                    error.message,
                    "danger"
                );

            } finally {

                if (button) {

                    button.disabled = false;
                    button.textContent = "Controlla";
                }
            }
        }


        document
            .getElementById("check-all-button")
            .addEventListener(
                "click",
                checkAll
            );


        async function checkAll() {

            if (checkingAll) {
                return;
            }

            checkingAll = true;

            const button =
                document.getElementById("check-all-button");

            button.disabled = true;
            button.textContent = "Controllo in corso...";

            try {

                const result =
                    await api("/api/urls");

                const urls =
                    result.urls;

                if (urls.length === 0) {

                    showMessage(
                        "Nessun URL da controllare.",
                        "info"
                    );

                    return;
                }

                showMessage(
                    "Controllo di " +
                    urls.length +
                    " URL in corso...",
                    "info"
                );

                for (const item of urls) {
                    await checkUrl(item.url);
                }

                await loadUrls();

                showMessage(
                    "Controllo completato.",
                    "success"
                );

            } catch (error) {

                showMessage(
                    error.message,
                    "danger"
                );

            } finally {

                checkingAll = false;

                button.disabled = false;
                button.textContent = "Controlla tutti";
            }
        }


        /* =========================================================
           UTENTI
           ========================================================= */

        async function loadUsers() {

            const result =
                await api("/api/users");

            const tbody =
                document.getElementById("user-table-body");

            tbody.innerHTML = "";

            for (const user of result.users) {
                renderUserRow(user);
            }
        }


        function renderUserRow(user) {

            const tbody =
                document.getElementById("user-table-body");

            const row =
                document.createElement("tr");


            /* NOME UTENTE */

            const usernameCell =
                document.createElement("td");

            usernameCell.textContent =
                user.nomeutente;


            /* API KEY */

            const apiKeyCell =
                document.createElement("td");

            const apiKeyCode =
                document.createElement("code");

            apiKeyCode.textContent =
                user.apikey;

            apiKeyCell.appendChild(apiKeyCode);


            /* ADMIN */

            const typeCell =
                document.createElement("td");

            const adminLabel =
                document.createElement("label");

            adminLabel.className =
                "form-check mb-0";

            const adminCheckbox =
                document.createElement("input");

            adminCheckbox.type = "checkbox";
            adminCheckbox.className = "form-check-input";
            adminCheckbox.checked = user.admin === 1;

            const adminText =
                document.createElement("span");

            adminText.className =
                "form-check-label";

            adminCheckbox.addEventListener(
                "change",
                function () {

                    updateUser(
                        user.nomeutente,
                        {
                            admin:
                                adminCheckbox.checked
                                    ? 1
                                    : 0
                        },
                        adminCheckbox,
                        function (value) {

                            adminCheckbox.checked =
                                value === 1;
                        }
                    );
                }
            );

            adminLabel.appendChild(adminCheckbox);
            adminLabel.appendChild(adminText);

            typeCell.appendChild(adminLabel);


            /* DISPONIBILE */

            const availableCell =
                document.createElement("td");

            const availableLabel =
                document.createElement("label");

            availableLabel.className =
                "form-check mb-0";

            const availableCheckbox =
                document.createElement("input");

            availableCheckbox.type = "checkbox";
            availableCheckbox.className = "form-check-input";
            availableCheckbox.checked = user.available === 1;

            const availableText =
                document.createElement("span");

            availableText.className =
                "form-check-label";

            availableCheckbox.addEventListener(
                "change",
                function () {

                    updateUser(
                        user.nomeutente,
                        {
                            available:
                                availableCheckbox.checked
                                    ? 1
                                    : 0
                        },
                        availableCheckbox,
                        function (value) {

                            availableCheckbox.checked =
                                value === 1;
                        }
                    );
                }
            );

            availableLabel.appendChild(availableCheckbox);
            availableLabel.appendChild(availableText);

            availableCell.appendChild(availableLabel);


            /* AZIONI */

            const actionsCell =
                document.createElement("td");

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "btn btn-outline-danger btn-sm";

            deleteButton.textContent =
                "Elimina";

            const loggedUsername =
                document
                    .getElementById("logged-user")
                    .dataset.username || "";

            if (
                user.nomeutente ===
                loggedUsername
            ) {

                deleteButton.disabled = true;

                deleteButton.title =
                    "Non puoi eliminare l'utente attualmente autenticato";

            } else {

                deleteButton.addEventListener(
                    "click",
                    function () {
                        deleteUser(user.nomeutente);
                    }
                );
            }

            actionsCell.appendChild(deleteButton);


            /* ROW */

            row.appendChild(usernameCell);
            row.appendChild(apiKeyCell);
            row.appendChild(typeCell);
            row.appendChild(availableCell);
            row.appendChild(actionsCell);

            tbody.appendChild(row);
        }


        /* =========================================================
           UPDATE UTENTE
           ========================================================= */

        async function updateUser(
            username,
            changes,
            checkbox,
            updateUi
        ) {

            checkbox.disabled = true;

            try {

                const result = await api(
                    "/api/users/" +
                    encodeURIComponent(username),
                    {
                        method: "PATCH",

                        body: JSON.stringify(changes)
                    }
                );

                if (
                    changes.admin !== undefined
                ) {

                    updateUi(result.admin);
                }

                if (
                    changes.available !== undefined
                ) {

                    updateUi(result.available);
                }

            } catch (error) {

                await loadUsers();

                showMessage(
                    error.message,
                    "danger"
                );

            } finally {

                checkbox.disabled = false;
            }
        }


        /* =========================================================
           AGGIUNTA URL
           ========================================================= */

        document
            .getElementById("add-url-form")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    const input =
                        document.getElementById("new-url");

                    const url =
                        input.value.trim();

                    if (!url) {
                        return;
                    }

                    try {

                        const result =
                            await api(
                                "/api/urls",
                                {
                                    method: "POST",

                                    body: JSON.stringify({
                                        url: url
                                    })
                                }
                            );

                        input.value = "";

                        closeModal("add-url-modal");

                        await loadUrls();

                        showMessage(
                            result.url !== url
                                ? "URL aggiunto e aggiornato al redirect."
                                : "URL aggiunto.",
                            "success"
                        );

                    } catch (error) {

                        showMessage(
                            error.message,
                            "danger"
                        );
                    }
                }
            );


        /* =========================================================
           AGGIUNTA UTENTE
           ========================================================= */

        document
            .getElementById("add-user-form")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    const usernameInput =
                        document.getElementById("new-username");

                    const adminInput =
                        document.getElementById("new-user-admin");

                    const availableInput =
                        document.getElementById("new-user-available");

                    const username =
                        usernameInput.value.trim();

                    const admin =
                        adminInput.checked ? 1 : 0;

                    const available =
                        availableInput.checked ? 1 : 0;

                    if (!username) {
                        return;
                    }

                    try {

                        await api(
                            "/api/users",
                            {
                                method: "POST",

                                body: JSON.stringify({
                                    username: username,
                                    admin: admin,
                                    available: available
                                })
                            }
                        );

                        usernameInput.value = "";
                        adminInput.checked = false;
                        availableInput.checked = true;

                        closeModal("add-user-modal");

                        await loadUsers();

                    } catch (error) {

                        showMessage(
                            error.message,
                            "danger"
                        );
                    }
                }
            );


        /* =========================================================
           ELIMINAZIONE UTENTE
           ========================================================= */

        async function deleteUser(username) {

            if (
                !confirm(
                    "Vuoi eliminare questo utente?\n\n" +
                    username
                )
            ) {
                return;
            }

            try {

                await api(
                    "/api/users/" +
                    encodeURIComponent(username),
                    {
                        method: "DELETE"
                    }
                );

                await loadUsers();

            } catch (error) {

                showMessage(
                    error.message,
                    "danger"
                );
            }
        }


        /* =========================================================
           LOGOUT
           ========================================================= */

        document
            .getElementById("logout-button")
            .addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();

                    try {

                        await api(
                            "/api/logout",
                            {
                                method: "POST"
                            }
                        );

                    } finally {

                        document
                            .getElementById("admin-page")
                            .classList.add("d-none");

                        document
                            .getElementById("login-page")
                            .classList.remove("d-none");

                        document
                            .getElementById("api-key")
                            .value = "";

                        const loggedUser =
                            document.getElementById("logged-user");

                        loggedUser.textContent = "Admin";
                        loggedUser.dataset.username = "";
                    }
                }
            );


        /* =========================================================
           MESSAGGI
           ========================================================= */

        function showMessage(text, type) {

            const element =
                document.getElementById("message");

            element.className =
                "alert alert-" + type;

            element.textContent =
                text;

            setTimeout(
                function () {

                    element.className =
                        "alert d-none";

                },
                3000
            );
        }

    </script>

</body>

</html>
